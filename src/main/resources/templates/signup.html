<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Parking Management System</title>
    <link rel="stylesheet" href="/css/custom.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Override body flex for signup page */
        body.signup-page {
            display: block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .signup-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .signup-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: none;
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }
        
        .signup-header {
            background: linear-gradient(135deg, #002B5B 0%, #1A5276 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .signup-header i {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }
        
        .signup-header h3 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
        }
        
        .signup-header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
            font-size: 0.9rem;
        }
        
        .signup-body {
            padding: 40px 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }
        
        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .input-group i {
            position: absolute;
            left: 15px;
            color: #666;
            z-index: 2;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #002B5B;
            box-shadow: 0 0 0 3px rgba(0, 43, 91, 0.1);
            background: white;
        }
        
        .signup-btn {
            width: 100%;
            background: linear-gradient(135deg, #002B5B 0%, #1A5276 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 43, 91, 0.3);
        }
        
        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            border: none;
        }
        
        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }
        
        .signup-links {
            text-align: center;
            margin-top: 20px;
        }
        
        .signup-links a {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            background: #6c757d;
            color: white;
        }
        
        .signup-links a:hover {
            background: #545b62;
            color: white;
            transform: translateY(-2px);
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .signup-container {
                padding: 10px;
            }
            
            .signup-body {
                padding: 30px 20px;
            }
            
            .signup-header {
                padding: 20px;
            }
            
            .signup-header i {
                font-size: 2.5rem;
            }
            
            .signup-header h3 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body class="signup-page">
    <div class="signup-container">
        <div class="signup-card">
            <div class="signup-header">
                <i class="fas fa-user-plus"></i>
                <h3>Create Account</h3>
                <p>Sign up to manage your parking bookings</p>
            </div>
            
            <div class="signup-body">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="@{/signup}" method="post" th:object="${user}">
                    <div class="form-group">
                        <label>Full Name</label>
                        <div class="input-group">
                            <i class="fas fa-id-card"></i>
                            <input type="text" th:field="*{fullName}" required placeholder="Enter your full name">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <div class="input-group">
                            <i class="fas fa-phone"></i>
                            <input type="text" th:field="*{phoneNumber}" required placeholder="Enter your phone number">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" th:field="*{email}" required placeholder="Enter your email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Username</label>
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" th:field="*{username}" required placeholder="Choose a username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" th:field="*{password}" required placeholder="Create a password">
                        </div>
                    </div>

                    <button type="submit" class="signup-btn">
                        <i class="fas fa-user-plus"></i> Sign Up
                    </button>
                </form>

                <div class="signup-links">
                    <a href="/login">
                        <i class="fas fa-sign-in-alt"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
