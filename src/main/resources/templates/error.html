<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title">Something went wrong</h3>
                    <p class="text-muted">We couldn't find the page you requested or an error occurred.</p>
                    <hr>
                    <p><strong>Status:</strong> <span th:text="${status}">404</span> - <span th:text="${reason}">Not Found</span></p>
                    <p th:if="${message}"><strong>Message:</strong> <span th:text="${message}"></span></p>
                    <div class="mt-3">
                        <a href="/" class="btn btn-primary">Go Home</a>
                        <a href="/profile" class="btn btn-outline-secondary">My Profile</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
 </div>
</body>
</html>
