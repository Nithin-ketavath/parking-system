
# --- MySQL Datasource ---
spring.datasource.url=jdbc:mysql://localhost:3306/parking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
 # Change to your MySQL root password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA/Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Server ---
server.port=8080
server.servlet.context-path=/

# --- Logging (optional) ---
# logging.level.com.apc.parking=DEBUG
# logging.level.org.springframework.security=INFO

# JWT settings
# Use a secure, random 256-bit key in production (base64). This is an example key; rotate it in real deployments.
jwt.secret=ZmFrZXNlY3JldGtleWZha2VzZWNyZXRrZXlmYWtlc2VjcmV0a2V5MTIzNDU=
# expiration in milliseconds (e.g., 24h = 86400000)
jwt.expirationMs=86400000
